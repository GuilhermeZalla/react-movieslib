version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      router:
        patterns:
          - react-router
          - react-router-dom
          - '@remix-run/router'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
